name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python-version: ["3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}", cache: pip }
      - run: python -m pip install -U pip && python -m pip install -e ".[dev]"
      - run: python -m ruff check algorithms model tests benchmarks *.py
      - run: python -m ruff format --check algorithms model tests benchmarks *.py
      - run: python -m mypy
      - run: python -m pytest --cov --cov-fail-under=85

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm install
      - run: npm run lint
      - run: npm run build
