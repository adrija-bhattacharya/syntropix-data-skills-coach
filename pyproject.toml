[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "velpo"
version = "1.0.0"
description = "Personalised Learning-Path Optimisation via graph traversal + constrained multi-objective dynamic programming (DAA project)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adrija Bhattacharya" }]

dependencies = [
    "networkx>=3.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
    "matplotlib>=3.8",
]

[project.scripts]
velpo = "velpo:main"
velpo-api = "api:run"

# flat layout: the code lives directly at the repo root
[tool.setuptools]
py-modules = ["config", "curriculum", "domain_data", "domains", "dynamic", "assessment_bank", "certifications", "engine", "explain", "roadmap", "api", "velpo"]

[tool.setuptools.packages.find]
include = ["algorithms*", "model*", "harvest*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B905"]  # zip() strict= - lengths are known-equal at every call site

[tool.ruff.lint.isort]
known-first-party = ["algorithms", "model", "harvest", "benchmarks", "config", "curriculum", "domain_data", "domains", "dynamic", "assessment_bank", "certifications", "engine", "explain", "roadmap", "api", "velpo"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["algorithms", "model", "harvest", "config.py", "curriculum.py", "domain_data.py", "domains.py", "dynamic.py", "assessment_bank.py", "certifications.py", "engine.py", "explain.py", "roadmap.py", "api.py", "velpo.py"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["algorithms", "model", "engine", "explain", "curriculum"]
branch = true
